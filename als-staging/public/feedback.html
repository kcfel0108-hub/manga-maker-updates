<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090f15"><meta name="robots" content="noindex,nofollow"><title>フィードバック | ARTIST LIVE SHEET</title><style>body{margin:0;background:#090f15;color:#eef4fa;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:720px;margin:0 auto;padding:48px 20px}.card{background:#111a23;border:1px solid #243443;border-radius:18px;padding:24px}h1{font-size:28px;margin-top:0}p{color:#aebdca;line-height:1.8}label{display:block;margin:18px 0 8px;font-weight:700}select,textarea{width:100%;box-sizing:border-box;background:#0b1219;color:#eef4fa;border:1px solid #314557;border-radius:10px;padding:12px;font:inherit}textarea{min-height:180px;resize:vertical}button{margin-top:18px;background:#eaf2f8;color:#071018;border:0;border-radius:999px;padding:12px 20px;font-weight:800;cursor:pointer}.status{margin-top:14px;min-height:24px;color:#9fd6b4}.muted{font-size:13px;color:#8496a6}a{color:#d8e8f5}</style></head><body><main class="wrap"><div class="card"><h1>フィードバック</h1><p>ARTIST LIVE SHEET Public Betaをご利用いただきありがとうございます。不具合、使いにくい点、追加してほしい機能などをお送りください。</p><form id="feedback-form"><label for="category">種類</label><select id="category" name="category"><option value="bug">不具合</option><option value="usability">使いにくさ</option><option value="feature">機能要望</option><option value="other">その他</option></select><label for="message">内容</label><textarea id="message" name="message" maxlength="3000" required placeholder="できるだけ具体的にご記入ください。"></textarea><button type="submit">送信する</button><div class="status" id="status" role="status" aria-live="polite"></div></form><p class="muted">送信時に、入力内容・種類・ブラウザ情報がARTIST LIVE SHEETのサーバーへ送信されます。個人情報や機密情報は入力しないでください。</p><p><a href="/">ARTIST LIVE SHEETへ戻る</a> · <a href="/privacy.html">プライバシーポリシー</a></p></div></main><script src="/feedback.js"></script></body></html>
